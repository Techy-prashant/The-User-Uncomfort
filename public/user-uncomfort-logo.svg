    <text x="600" y="295" text-anchor="middle" fill="#ffffff" font-size="86" font-family="Fredoka, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="1">User_Uncomfort</text>
    <text x="600" y="365" text-anchor="middle" fill="#d4e8ff" font-size="36" font-family="Fredoka, Segoe UI, Arial, sans-serif" font-weight="500">Making you not Comfortable</text>
